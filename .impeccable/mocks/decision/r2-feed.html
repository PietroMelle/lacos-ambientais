<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@800&family=Funnel+Sans:wght@400;600&display=swap">
<style>
*{box-sizing:border-box}body{margin:0;width:390px;height:844px;overflow:hidden;background:#1f5aa8;color:#fff;font:16px/1.5 "Funnel Sans",sans-serif;position:relative}
nav{display:flex;justify-content:space-between;padding:18px 20px;font:800 19px "Funnel Display"}
.rail{position:absolute;right:16px;bottom:170px;display:grid;gap:22px;justify-items:center;font:600 12px "Funnel Sans"}
.rail i{display:block;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.18);border:2px solid #fff}
.cap{position:absolute;left:20px;right:90px;bottom:120px}
.cap small{font-weight:600}
.cap h1{font:800 96px/.9 "Funnel Display";margin:6px 0 10px;letter-spacing:-.04em}
.peek{position:absolute;left:0;right:0;bottom:0;height:70px;background:#cf3a2e;border-radius:22px 22px 0 0;padding:16px 20px;font:800 26px "Funnel Display"}
</style></head><body>
<nav><span>Laços Ambientais</span><span>1 / 5</span></nav>
<div class="rail"><span><i></i>Registrar</span><span><i></i>Ranking</span><span><i></i>Dicas</span></div>
<div class="cap"><small>Lixeira azul</small><h1>Papel</h1><p>Papel limpo e seco vira papel de novo.</p></div>
<div class="peek">Plástico</div>
</body></html>
