<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@500;800&family=Funnel+Sans:wght@400;600&display=swap">
<style>
:root{--g:#eef0ec;--i:#15181b;--az:#1f5aa8;--vm:#cf3a2e;--vd:#23804a;--am:#f0b400;--mr:#7b4b27}
*{box-sizing:border-box}body{margin:0;width:390px;height:844px;overflow:hidden;background:var(--g);color:var(--i);font:16px/1.5 "Funnel Sans",sans-serif;position:relative}
nav{display:flex;justify-content:space-between;align-items:center;padding:18px 20px}
.m{font:800 19px "Funnel Display";display:flex;gap:8px;align-items:center}.k{width:26px;height:14px;border:4px solid var(--i);border-radius:9px;position:relative}
nav a{font:600 15px "Funnel Sans";border:2px solid var(--i);border-radius:99px;padding:6px 14px}
h1{font:800 66px/.92 "Funnel Display";letter-spacing:-.035em;margin:26px 20px 0;position:relative;z-index:2}
h1 em{font-style:normal;position:relative;z-index:1}
svg.c{position:absolute;left:0;top:300px;width:390px;height:560px;z-index:3}
p{margin:22px 20px 0;max-width:30ch;font-size:17px;position:relative;z-index:4}
.b{position:absolute;left:20px;right:20px;bottom:26px;z-index:4;display:grid;gap:8px}
.b div{display:flex;justify-content:space-between;align-items:center;background:#fff;border-radius:14px;padding:14px 16px;font:800 22px "Funnel Display";border-left:10px solid var(--c)}
.b small{font:600 13px "Funnel Sans";color:#59605f}
</style></head><body>
<nav><span class="m"><span class="k"></span>Laços Ambientais</span><a>Ranking</a></nav>
<h1>Pequenos gestos, grandes <em>laços.</em></h1>
<svg class="c" viewBox="0 0 390 560" fill="none" stroke-linecap="round">
 <g stroke-width="9">
  <path d="M-10 40 C 80 10, 120 90, 200 50 S 330 20, 360 120 S 300 260, 40 330" stroke="#1f5aa8"/>
  <path d="M-10 52 C 80 40, 120 60, 200 70 S 320 50, 352 130 S 290 280, 40 392" stroke="#cf3a2e"/>
  <path d="M-10 64 C 80 70, 120 30, 200 90 S 310 80, 344 140 S 280 300, 40 454" stroke="#23804a" stroke-dasharray="1 0"/>
  <path d="M-10 76 C 80 100, 120 0, 200 110 S 300 110, 336 150 S 270 320, 40 516" stroke="#f0b400"/>
  <path d="M-10 88 C 80 130, 120 -20, 200 130 S 290 140, 328 160 S 260 340, 40 578" stroke="#7b4b27"/>
 </g>
 <g stroke="#fff" stroke-width="1.6" opacity=".55">
  <path d="M-10 40 C 80 10, 120 90, 200 50 S 330 20, 360 120" stroke-dasharray="3 6"/>
  <path d="M-10 64 C 80 70, 120 30, 200 90 S 310 80, 344 140" stroke-dasharray="1 4"/>
 </g>
</svg>
<p>A empresa da turma de Jovem Aprendiz que deixa a faculdade mais verde — uma latinha de cada vez.</p>
<div class="b">
 <div style="--c:var(--az)">Papel<small>Lixeira azul</small></div>
 <div style="--c:var(--vm)">Plástico<small>Lixeira vermelha</small></div>
 <div style="--c:var(--vd)">Vidro<small>Lixeira verde</small></div>
</div>
</body></html>
