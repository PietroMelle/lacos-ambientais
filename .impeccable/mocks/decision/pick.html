<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>Álbum</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@500;800&display=swap" rel="stylesheet">
<style>
body{margin:0;width:390px;height:844px;overflow:hidden;background:#f4d23c;color:#0b2a17;font-family:"Archivo",sans-serif}
.band{background:#0b6b3a;color:#f4d23c;padding:14px 16px;display:flex;justify-content:space-between;font-family:Anton;font-size:20px;letter-spacing:.03em}
h1{font-family:Anton;font-size:52px;line-height:.95;margin:18px 16px 8px;color:#0b6b3a;text-transform:uppercase}
p{margin:0 16px 14px;font-size:16px;line-height:1.4}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:6px 16px}
.slot{background:#e9c22c;border:2px dashed #b8951a;height:150px;position:relative;display:grid;place-items:center;font-family:Anton;font-size:30px;color:#b8951a}
.stk{position:absolute;inset:-2px;background:#fff;padding:7px;transform:rotate(-2deg);box-shadow:0 1px 0 #c9a524}
.stk div{height:100%;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;color:#fff;font-family:Anton;font-size:26px;line-height:1}
.stk small{font-family:Archivo;font-weight:800;font-size:11px;letter-spacing:.08em}
.n{position:absolute;top:6px;left:8px;background:#0b2a17;color:#f4d23c;font-family:Anton;font-size:14px;padding:1px 6px;z-index:2}
.cta{margin:16px;background:#e2463a;color:#fff;font-family:Anton;font-size:24px;text-align:center;padding:14px;text-transform:uppercase}
</style></head><body>
<div class="band"><span>LAÇOS AMBIENTAIS</span><span>ÁLBUM DO MÊS</span></div>
<h1>Pequenos gestos, grandes laços.</h1>
<p>Toque numa figurinha para saber o que vai em cada lixeira.</p>
<div class="pg">
<div class="slot"><span class="n">01</span><div class="stk"><div style="background:#1f6fd1">PAPEL<small>LIXEIRA AZUL</small></div></div></div>
<div class="slot"><span class="n">02</span><div class="stk" style="transform:rotate(1.5deg)"><div style="background:#d6333f">PLÁSTICO<small>LIXEIRA VERMELHA</small></div></div></div>
<div class="slot"><span class="n">03</span><div class="stk" style="transform:rotate(-.5deg)"><div style="background:#168a47">VIDRO<small>LIXEIRA VERDE</small></div></div></div>
<div class="slot">04</div>
</div>
<div class="cta">Colar figurinha (registrar)</div>
</body></html>
