<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QR Codes para impressão — Laços Ambientais</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .painel { max-width: 720px; margin: 24px auto; }
    .folhas { display: grid; gap: 24px; justify-content: center; padding: 0 16px 40px; }
    .folha {
      width: 190mm; height: 270mm; background: #fff; border-radius: 0;
      display: flex; flex-direction: column; overflow: hidden; --c: #cf3a2e; --t: #fafbf8; break-after: page;
    }
    .folha-topo { background: var(--c); color: var(--t); padding: 12mm 12mm 0; }
    .folha-topo .linha1 { display: flex; align-items: flex-start; justify-content: space-between; gap: 8mm; }
    .folha-topo .e { display: grid; place-items: center; flex: none; width: 30mm; height: 30mm; border: 1mm solid currentColor; border-radius: 50%; }
    .folha-topo .e svg { width: 17mm; height: 17mm; stroke-width: 1.8; }
    .folha-topo .cor { font-weight: 700; font-size: 7mm; line-height: 1; margin: 2mm 0 0; }
    .folha-topo .tipo { font-family: var(--display); font-weight: 800; font-size: 30mm; line-height: .9; letter-spacing: -.04em; margin: 6mm 0 9mm; }
    .folha-fio { --fc: var(--t); height: 4mm; margin: 0 -12mm 8mm; background: var(--trama-bg); }
    .folha-meio { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 4mm 14mm; text-align: center; }
    .folha-meio .exemplos { font-size: 5mm; font-weight: 600; color: var(--tinta-2); margin: 0 0 6mm; }
    .qr { width: 95mm; height: 95mm; }
    .qr svg { width: 100%; height: 100%; display: block; }
    .folha-meio .cta { font-family: var(--display); font-weight: 800; font-size: 10mm; line-height: 1; letter-spacing: -.02em; margin: 6mm 0 0; color: var(--tinta); }
    .folha-meio .sub { font-size: 5mm; font-weight: 600; color: var(--tinta-2); margin: 2mm 0 0; }
    .folha-pe { position: relative; display: flex; align-items: center; justify-content: center; gap: 3mm; padding: 6mm 4mm 5mm; font-family: var(--display); font-weight: 800; font-size: 6.5mm; letter-spacing: -.02em; color: var(--tinta); }
    .folha-pe::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3mm; background: var(--corda); }
    .folha-pe svg { width: 9mm; height: 9mm; }
    @media print {
      @page { size: A4 portrait; margin: 10mm; }
      body { background: #fff; }
      .painel, .aviso-demo, #topo, #rodape { display: none !important; }
      .folhas { padding: 0; gap: 0; }
      .folha { box-shadow: none; border-radius: 0; }
      * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
    @media screen and (max-width: 800px) { .folha { zoom: .45; } }
  </style>
</head>
<body>
  <header id="topo"></header>

  <section class="painel cartao" style="margin-inline:auto;width:min(720px,calc(100% - 40px))">
    <h2 data-ic="impressora">QR Codes para as lixeiras e a pipoca</h2>
    <p>Confira o endereço do site publicado (o mesmo que aparece na barra do navegador) e clique em imprimir. Sai uma folha A4 por lixeira, mais a da pipoca.</p>
    <label for="base">Endereço do site</label>
    <input type="text" id="base" placeholder="https://seu-usuario.github.io/lacos-ambientais/">
    <p class="ajuda">Dica: teste cada QR com o celular antes de colar na caixa.</p>
    <button class="botao" id="imprimir" type="button">Imprimir / salvar PDF</button>
  </section>

  <div class="folhas" id="folhas"></div>

  <footer id="rodape"></footer>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/lacos.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/cordao.js"></script>
  <script src="assets/js/qrcode.js"></script>
  <script>
  (function () {
    const $ = (id) => document.getElementById(id);
    const padrao = location.protocol.startsWith("http") ? location.href.replace(/qrcodes\.html.*$/, "") : "";
    $("base").value = Lacos.recuperar("lacos_base_qr") || padrao;

    function svgQR(url) {
      const q = qrcode(0, "M");
      q.addData(url);
      q.make();
      return q.createSvgTag({ cellSize: 8, margin: 2, scalable: true });
    }

    function desenhar() {
      let base = $("base").value.trim();
      if (base && !base.endsWith("/")) base += "/";
      Lacos.guardar("lacos_base_qr", base);
      const folhas = Object.entries(Lacos.LIXOS).map(([id, L]) => `
        <div class="folha" style="--c:${L.hex};--t:${L.texto || "#fafbf8"}">
          <div class="folha-topo">
            <div class="linha1"><p class="cor">Lixeira ${L.cor}</p><div class="e">${Lacos.icone(id)}</div></div>
            <p class="tipo">${L.nome}</p>
            <div class="folha-fio" data-trama="${L.trama}"></div>
          </div>
          <div class="folha-meio">
            <p class="exemplos">${L.pode.slice(0, 3).map(Lacos.esc).join(" · ")}</p>
            <div class="qr">${svgQR(base + "lixeira.html?tipo=" + id)}</div>
            <p class="cta">Descartou? Aponte a câmera!</p>
            <p class="sub">Aprenda o que vai aqui e concorra a prêmios todo mês</p>
          </div>
          <div class="folha-pe">${Lacos.icone("laco")}Laços Ambientais</div>
        </div>`);
      folhas.push(`
        <div class="folha" style="--c:#cf3a2e;--t:#fafbf8">
          <div class="folha-topo">
            <div class="linha1"><p class="cor">Gincana Sustentável</p><div class="e">${Lacos.icone("pipoca")}</div></div>
            <p class="tipo" style="font-size:16mm">Resgate sua pipoca!</p>
            <div class="folha-fio" data-trama="liso"></div>
          </div>
          <div class="folha-meio">
            <p class="exemplos">Passou pelas estações? A pipoca é sua.</p>
            <div class="qr">${svgQR(base + "pipoca.html")}</div>
            <p class="cta">Aponte a câmera e resgate</p>
            <p class="sub">Uma pipoca por pessoa · mostre o código para a equipe</p>
          </div>
          <div class="folha-pe">${Lacos.icone("laco")}Laços Ambientais</div>
        </div>`);
      $("folhas").innerHTML = folhas.join("");
    }

    $("base").addEventListener("input", desenhar);
    $("imprimir").addEventListener("click", () => window.print());
    desenhar();
  })();
  </script>
</body>
</html>
